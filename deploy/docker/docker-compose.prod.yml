services:
  postgres:
    image: postgres:16
    restart: always
    env_file: ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-borofone_prod} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prod_network

  redis:
    image: redis:7-alpine
    restart: always
    env_file: ../../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - prod_network

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: always
    env_file: ../../.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HOST_DATA_ROOT:?HOST_DATA_ROOT is required}/uploads:/code/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:{}/healthz''.format(os.environ.get(''APP_PORT'', ''8000'')), timeout=5)"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_network

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: always
    command: ["python", "-m", "app.worker"]
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_network

  coturn:
    image: coturn/coturn:4.15.0-r0
    restart: always
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --realm=${TURN_HOST:?TURN_HOST is required}
      - --server-name=${TURN_HOST:?TURN_HOST is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --alt-listening-port=443
      - --min-port=49160
      - --max-port=49260
      - --cert=/etc/letsencrypt/live/${TURN_HOST}/fullchain.pem
      - --pkey=/etc/letsencrypt/live/${TURN_HOST}/privkey.pem
      - --no-multicast-peers
      - --no-loopback-peers
      - --stale-nonce=600
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "443:443/udp"
      - "5349:5349/tcp"
      - "49160-49260:49160-49260/udp"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - prod_network

volumes:
  postgres_data:
    name: borofone-prod_postgres_data
  redis_data:
    name: borofone-prod_redis_data

networks:
  prod_network:
    name: borofone-prod_network
    driver: bridge
