<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Восстановление пароля — Borotalk</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/borotalk-64.png?v=2">
    <link rel="stylesheet" href="/styles/nova-auth.css?v=9">
    <script src="/app-config.js"></script>
</head>
<body data-account-action="forgot-password">
    <main class="auth-page">
        <form class="action-card" id="actionForm">
            <a class="brand" href="/"><span>B</span>Borotalk</a>
            <span class="eyebrow">восстановление доступа</span>
            <h1>Сбросить пароль</h1>
            <p>Если аккаунт существует, мы отправим одноразовую ссылку на его email.</p>
            <label><span>Email</span><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></label>
            <p class="form-error" id="errorText" aria-live="polite"></p>
            <p class="form-success" id="successText" aria-live="polite"></p>
            <button class="primary-button" id="actionButton" type="submit">Отправить ссылку</button>
            <p class="auth-link"><a href="/login.html">Вернуться ко входу</a></p>
        </form>
    </main>
    <script type="module" src="/js/account-action.js?v=1"></script>
</body>
</html>
