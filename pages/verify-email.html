<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Подтверждение email — Borotalk</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/borotalk-64.png?v=2">
    <link rel="stylesheet" href="/styles/nova-auth.css?v=9">
    <script src="/app-config.js"></script>
</head>
<body data-account-action="verify-email">
    <main class="auth-page">
        <section class="action-card">
            <a class="brand" href="/"><span>B</span>Borotalk</a>
            <span class="eyebrow">закрытая экосистема</span>
            <h1>Подтвердить email</h1>
            <p id="actionLead">Нажмите кнопку, чтобы подтвердить адрес. Ссылка сработает только один раз.</p>
            <p class="form-error" id="errorText" aria-live="polite"></p>
            <p class="form-success" id="successText" aria-live="polite"></p>
            <button class="primary-button" id="actionButton" type="button">Подтвердить email</button>
            <p class="auth-link"><a href="/login.html">Вернуться ко входу</a></p>
        </section>
    </main>
    <script type="module" src="/js/account-action.js?v=1"></script>
</body>
</html>
