<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Новый пароль — Borotalk</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/borotalk-64.png?v=2">
    <link rel="stylesheet" href="/styles/nova-auth.css?v=9">
    <script src="/app-config.js"></script>
</head>
<body data-account-action="reset-password">
    <main class="auth-page">
        <form class="action-card" id="actionForm">
            <a class="brand" href="/"><span>B</span>Borotalk</a>
            <span class="eyebrow">новый пароль</span>
            <h1>Вернуть доступ</h1>
            <p>После смены пароля все прежние refresh-сессии будут отозваны.</p>
            <label><span>Новый пароль</span><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
            <label><span>Повторите пароль</span><input id="passwordRepeat" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
            <p class="form-error" id="errorText" aria-live="polite"></p>
            <p class="form-success" id="successText" aria-live="polite"></p>
            <button class="primary-button" id="actionButton" type="submit">Сохранить новый пароль</button>
            <p class="auth-link"><a href="/login.html">Вернуться ко входу</a></p>
        </form>
    </main>
    <script type="module" src="/js/account-action.js?v=1"></script>
</body>
</html>
